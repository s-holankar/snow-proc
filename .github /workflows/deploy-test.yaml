name: Deploy TEST

on:
  push:
    branches:
      - test

jobs:
  deploy-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Show Files
        run: |
          echo "Deploying to TEST"
          find . -type f

      - name: Display SQL Files
        run: |
          cat schemas/*.sql
