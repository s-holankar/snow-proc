name: Deploy DEV

on:
  push:
    branches:
      - dev

jobs:
  deploy-dev:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Show Files
        run: |
          echo "Deploying to DEV"
          find . -type f

      - name: Display SQL Files
        run: |
          cat schemas/*.sql
