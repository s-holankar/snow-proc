name: Deploy to Snowflake DEV
 
on:
push:
branches:
- dev
 
jobs:
deploy-dev:
name: Deploy Procedures to DEV
runs-on: ubuntu-latest
 
environment: dev
 
env:
SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT_DEV }}
SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER_DEV }}
SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD_DEV }}
SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE_DEV }}
SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE_DEV }}
SNOWFLAKE_SCHEMA: ${{ secrets.SNOWFLAKE_SCHEMA_DEV }}
SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE_DEV }}
 
steps:
- name: Checkout Repository
uses: actions/checkout@v4
 
- name: Setup Python
uses: actions/setup-python@v5
with:
python-version: "3.11"
 
- name: Install Snowflake CLI
run: |
pip install snowflake-cli-labs
 
- name: Verify Snowflake Connection
run: |
snow connection add dev \
--account $SNOWFLAKE_ACCOUNT \
--user $SNOWFLAKE_USER \
--password $SNOWFLAKE_PASSWORD \
--warehouse $SNOWFLAKE_WAREHOUSE \
--database $SNOWFLAKE_DATABASE \
--schema $SNOWFLAKE_SCHEMA \
--role $SNOWFLAKE_ROLE
 
snow connection test --connection dev
 
- name: Deploy Procedures
run: |
for file in procedures/*.sql
do
echo "Deploying $file"
snow sql \
--connection dev \
-f "$file"
done
Branch Protection Setup
